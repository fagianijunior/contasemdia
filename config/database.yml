default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: 127.0.0.1
  port: 5432
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: contasemdia_development

test:
  <<: *default
  database: contasemdia_test

production:
  primary:
    <<: *default
    database: contasemdia_production
  cache:
    <<: *default
    database: contasemdia_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: contasemdia_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: contasemdia_production_cable
    migrations_paths: db/cable_migrate
